<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Header / Greeting Section (Challenge: Custom Name) -->
      <header class="greeting-card">
        <h1 class="greeting-heading">
          <span id="greeting-text">Good day</span>,
          <span
            id="username"
            class="username"
            contenteditable="true"
            title="Click to edit name"
            >Friend</span
          >
        </h1>
        <div id="clock" class="clock">00:00:00</div>
        <div id="date" class="date">Loading date...</div>
      </header>

      <!-- Main Content Layout -->
      <main class="dashboard-grid">
        <!-- Focus Timer Widget (Challenge: Custom Pomodoro Time) -->
        <section class="card widget-timer">
          <h2>Focus Timer</h2>

          <div class="timer-presets">
            <button class="btn btn-preset active" data-time="25">25m</button>
            <button class="btn btn-preset" data-time="15">15m</button>
            <button class="btn btn-preset" data-time="45">45m</button>
          </div>

          <div class="timer-display" id="timer-display">25:00</div>

          <div class="timer-controls">
            <button id="timer-start-btn" class="btn btn-primary">Start</button>
            <button id="timer-stop-btn" class="btn btn-secondary" disabled>
              Stop
            </button>
            <button id="timer-reset-btn" class="btn btn-outline">Reset</button>
          </div>
        </section>

        <!-- Quick Links Widget -->
        <section class="card widget-links">
          <h2>Quick Links</h2>
          <form id="link-form" class="input-form">
            <input
              type="text"
              id="link-title"
              placeholder="Site Name (e.g. GitHub)"
              required
            />
            <input
              type="url"
              id="link-url"
              placeholder="URL (https://...)"
              required
            />
            <button type="submit" class="btn btn-primary">Add</button>
          </form>
          <ul id="links-list" class="links-grid"></ul>
        </section>

        <!-- To-Do List Widget (Challenge: Prevent Duplicate Tasks) -->
        <section class="card widget-todo">
          <h2>Tasks</h2>
          <form id="todo-form" class="input-form">
            <input
              type="text"
              id="todo-input"
              placeholder="Add a new task..."
              required
            />
            <button type="submit" class="btn btn-primary">Add</button>
          </form>
          <ul id="todo-list" class="todo-list"></ul>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
